[package]
name = "wie-cpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WIE CPU engine trait and backends (Cranelift JIT default; iced interpreter)"

[dependencies]
thiserror.workspace = true
ahash.workspace = true
papaya.workspace = true
tracing.workspace = true
libc = "0.2"
# Persistent JIT code-cache ledger (bincode v2 native encode/derive, no serde).
bincode = { version = "2", default-features = false, features = ["std", "derive"] }
# Slim iced: decoder + Register helpers; drop encoder/formatters.
# no_xop / no_d3now: unused on PE64 MSVC paths (saves a little table RAM).
# Keep VEX/EVEX — CRT and many PE64s need them at decode time.
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "no_xop", "no_d3now"] }
# Host-native block JIT (Apple Silicon = ARM64)
cranelift = "0.133"
cranelift-codegen = "0.133"
cranelift-jit = "0.133"
cranelift-native = "0.133"
cranelift-module = "0.133"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "jit_hot_paths"
harness = false

[lints]
workspace = true
