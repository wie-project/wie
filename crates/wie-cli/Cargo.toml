[package]
name = "wie-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true

wie-pe = { path = "../wie-pe" }
wie-runtime = { path = "../wie-runtime" }
wie-winapi = { path = "../wie-winapi" }
wie-cpu = { path = "../wie-cpu" }

# macOS-only policy: winit's default features enable the X11/Wayland backends
# (Linux-only), which pull x11-dl, wayland-*, sctk, calloop, etc. into the
# feature graph and lockfile. The macOS backend compiles unconditionally —
# the only feature it needs is rwh_06 (raw-window-handle 0.6), which softbuffer
# requires to construct its surface from winit's Window.
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# softbuffer's default features (kms/x11/x11-dlopen/wayland/wayland-dlopen) are
# likewise Linux-only; the Apple backend is an unconditional target-gated dep.
softbuffer = { version = "0.4", default-features = false }

# macOS application menu bar (guest window menu -> top bar). muda is a safe
# wrapper over AppKit — no hand-written objc2 lives in this crate anymore.
# macOS-only dep: muda 0.19.3 with default-features disabled has no Linux
# backend (the gtk feature is required there, and it needs GTK3 system libs),
# so gating keeps non-macOS builds clean. Its internal objc2 0.6.x line is
# separate from winit's 0.5.2 and muda does not re-export objc2 types.
#
# wgpu (Metal backend) + pollster power the P4a present path (present_wgpu.rs).
# macOS-only policy: the "metal" feature is a no-op on non-Apple targets, so
# like muda these are target-gated to keep non-macOS builds clean. pollster
# blocks on the async adapter/device requests (no runtime in wie-cli). bytemuck
# provides the u32→u8 pixel-buffer view for write_texture (wgpu 30 removed its
# own `util::cast_slice`; bytemuck is wgpu's own replacement and already in the
# tree as a wgpu dependency).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.3", default-features = false, features = [] }
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
pollster = { version = "1.0" }
bytemuck = { version = "1" }
