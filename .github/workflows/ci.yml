name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS: never

jobs:
  check:
    name: Checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain before every check step below: fmt, clippy, nextest,
      # check.sh (cargo metadata) and check-non-macos.sh (cargo check) all
      # need a working cargo. `stable` matches rust-toolchain.toml, which is the
      # single source of truth for the toolchain version — do not pin a second
      # one here.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # The guest fixtures under micro-exes/out/ are cross-compiled PE64
      # binaries and are NOT tracked in git (micro-exes/.gitignore ignores
      # out/). Without this toolchain step every guest-PE integration test in
      # crates/wie-runtime/tests/ has no binary to run — and since a missing
      # fixture is a test failure (crates/wie-runtime/tests/common/mod.rs), the
      # test step below would fail on a clean runner.
      #
      # `brew install mingw-w64` is the same toolchain the project documents
      # (Homebrew mingw-w64); it ships prebuilt bottles for macOS on Apple
      # Silicon, so no compilation happens on the runner. The trailing
      # verification is deliberate: a silently missing compiler would show up
      # as ~40 confusing "missing guest fixture" failures instead of one clear
      # message here.
      #
      # Moving this job to ubuntu-latest? The equivalent is either
      #   sudo apt-get update && sudo apt-get install -y mingw-w64
      # (provides x86_64-w64-mingw32-gcc) or the pinned MSYS2 action
      #   uses: msys2/setup-msys2@v2
      #   with: { msystem: MINGW64, update: true, install: mingw-w64-gcc }
      - name: Install mingw-w64 cross toolchain
        run: |
          brew install mingw-w64
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version

      - name: Formatting
        run: cargo fmt --all --check

      # The two policy checks below live in scripts/check.sh as functions (that
      # file is the single source of truth for the gate). They are invoked here
      # one step at a time with --only, NOT as a bare `./scripts/check.sh`:
      # CI runs each check as its own named step, with the cache and toolchain
      # set up above and the expensive steps (clippy, fixtures, nextest,
      # micro-suite) below. A full `check.sh` call would re-run all of those
      # inside one step and collapse the separately-named, individually
      # retryable stages — and would re-download/rebuild with no cache benefit.
      # `--only` runs the identical function the local full gate runs.
      - name: File sizes
        run: ./scripts/check.sh --only file-sizes

      # The crate layering (wie-pe -> wie-cpu -> wie-winapi -> wie-runtime ->
      # wie-cli) is documented in CLAUDE.md as load-bearing, but no test asserted
      # it: an added `use` or a new `path =` entry could invert a layer and all
      # the ~1,900 tests would still pass. This pins the internal edge set
      # (check_deps() in scripts/check.sh). It runs right after the file-size
      # check because it costs ~1s (cargo metadata, no compile) and should fail
      # before anything expensive starts.
      - name: Crate dependency direction
        run: ./scripts/check.sh --only dep-direction

      # No -D warnings: scripts/check.sh (the authoritative local gate) runs
      # clippy advisory, and the workspace lint table denies no clippy lints
      # (Cargo.toml [workspace.lints]). Keep the two invocations identical.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # Before the tests: the guest-PE integration tests fail (not skip) when
      # their fixture is absent. `all` also builds the category targets the
      # micro-suite step runs, but it is written out here so the ordering
      # requirement is visible at the point where it matters.
      - name: Build guest fixtures
        run: make -C micro-exes

      # Same reasoning, one class up: the ~39 GUI tests under
      # crates/wie-runtime/tests/micro_gui_window/ run real_exes/notepad.exe
      # (RNotepad). real_exes/ is gitignored, so on a clean runner the binary is
      # simply absent — and a missing *real* guest is a test FAILURE, not a
      # skip (crates/wie-runtime/tests/common/mod.rs). That rule exists because
      # the alternative is worse than a red build: `real_exe()` used to return
      # None, the test returned (), and nextest recorded a PASS for a test that
      # executed nothing — 39 of them, in 0.02–0.08 s each. nextest only prints
      # a FAILING test's captured stderr, so the skip notice was invisible in
      # exactly the case it existed to report.
      #
      # So the fetch has to happen here, or the loud failure turns a false green
      # into a broken build. Needs: git (preinstalled), cmake (preinstalled on
      # macos runners) and the mingw-w64 cross toolchain installed above. The
      # trailing `file` check is deliberate: a fetch that silently produced
      # nothing would show up as ~39 identical fixture failures instead of one
      # clear message here.
      - name: Fetch real guest fixtures
        run: |
          ./scripts/fetch.sh notepad
          file real_exes/notepad.exe

      - name: Tests
        run: cargo nextest run --workspace

      - name: Build release
        run: cargo build -p wie-cli --release

      # The micro-suite is the end-to-end gate: it runs whole guest programs
      # through the release `wie` binary and asserts their exit codes. Only
      # the cheap, deterministic categories run on the push path:
      #   console_tests  1 exe
      #   pthread_tests   2 exes
      #   cpp_exes        5 exes
      #   dll_tests       6 exes + sibling DLL staging
      # Deliberately NOT here (they belong on a schedule/nightly axis, see
      # docs/testing-model.md): `all` (the ~70-exe data-driven sweep, which
      # includes long_loop's fixed 40 s window), `--matrix` (repeats a category
      # under WIE_JIT_MEM=slow/pin and the multi-minute WIE_CPU=iced leg), and
      # the 40 s fixed-window GUI harnesses.
      - name: Micro-suite
        run: |
          ./scripts/run-micro-suite.sh console_tests
          ./scripts/run-micro-suite.sh pthread_tests
          ./scripts/run-micro-suite.sh cpp_exes
          ./scripts/run-micro-suite.sh dll_tests

  # ---------------------------------------------------------------------------
  # Compile-check a non-Apple target.
  #
  # WHY: crates/wie-cli/Cargo.toml gates 9 dependencies behind
  # [target.'cfg(target_os = "macos")'.dependencies] with ~60 lines of
  # commentary asserting that non-Apple builds stay clean. Nothing verified that
  # claim — this is the first non-Apple compile check in the repo. It catches a
  # non-macOS-hostile dependency or `std::os::macos` path landing in a
  # non-gated [dependencies] entry.
  #
  # WHY ubuntu-latest: the check is only meaningful on a machine that is not
  # itself Apple. Running `cargo check --target x86_64-unknown-linux-gnu` from a
  # macOS runner would still need the target's rust-std, but the host matches the
  # target so a stray host-only assumption could pass unnoticed.
  #
  # No C cross-linker and no system packages are needed: `cargo check` links
  # nothing, so only the target's rust-std is required, and dtolnay/rust-toolchain
  # installs it. `stable` matches rust-toolchain.toml (the single source of truth
  # for the toolchain version); the target is the only addition here.
  #
  # SCOPE: the whole workspace, `--all-targets`, no crate exclusions — an
  # exclusion list silently stops covering a crate once it goes stale, which is
  # the failure this job exists to prevent. wie-cli's macOS-only subtree (the
  # winit/wgpu windowed presenter) is cfg-gated at the `mod` declarations in
  # crates/wie-cli/src/gui/mod.rs, so it compiles out cleanly off-Apple while the
  # portable entries still build.
  #
  # NOT continue-on-error, deliberately. The first run of this job FAILED on a
  # real defect: `winit` was NOT platform-gated (it sat in wie-cli's plain
  # [dependencies] with default-features = false + features = ["rwh_06"], so on
  # a non-Apple target winit 0.30 selects no backend and hits its own
  # `compile_error!("The platform you're compiling for is not supported by
  # winit")`). It compiled on macOS only by accident, because winit's macOS
  # backend is unconditional so that feature set happened to suffice there. The
  # script originally checked the other four crates explicitly and named this
  # blocker in its header plus a tripwire that reported when the exclusion went
  # stale. That is now FIXED: winit moved into the macOS target table and the
  # GUI subtree it feeds is gated, so the script checks --workspace outright.
  # Keep it strict — continue-on-error would let exactly this class of breakage
  # back in unnoticed.
  # ---------------------------------------------------------------------------
  non-macos-check:
    name: Non-macOS compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Non-macOS compile check
        run: ./scripts/check-non-macos.sh
