name: Bench

# On-demand only (no schedule): benchmarks are developer-local gates — this
# exists so a bench run can be triggered from the Actions tab against any
# ref (the old nightly cron was dropped in 2e97b0c).
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS: never

jobs:
  bench:
    name: Bench wie-cpu
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Bench
        run: cargo bench -p wie-cpu

      - name: Upload criterion report
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report-wie-cpu
          path: target/criterion
          if-no-files-found: error
