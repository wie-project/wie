# Build the Apple Silicon release binary on every push to main.
#
# The CI workflow (ci.yml) runs the quality gate (clippy + test matrix);
# this one produces the downloadable `wie-cli` binary for macOS arm64.
# The binary is attached to the run as an artifact — the Homebrew formula
# (wie-project/homebrew-wie) and manual downloads both consume it.

name: Build (Apple Silicon)

on:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build release binary (arm64)
    runs-on: macos-14 # GitHub's native Apple Silicon runner
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build wie-cli (release)
        run: cargo build -p wie-cli --release

      - name: Package the binary
        run: tar czf wie-macos-arm64.tar.gz -C target/release wie

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wie-macos-arm64
          path: wie-macos-arm64.tar.gz
          retention-days: 14
