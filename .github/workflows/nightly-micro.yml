name: Nightly Micro Suite

on:
  schedule:
    # 47 3 UTC daily (after Nightly Bench).
    - cron: '47 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_PROGRESS: never

jobs:
  micro-suite:
    name: Micro exe suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mingw-w64 cross toolchain
        run: brew install mingw-w64

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build guest micro exes
        run: make -C micro-exes -j4

      - name: Run micro suite
        run: ./scripts/run-micro-suite.sh all
