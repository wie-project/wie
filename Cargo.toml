[workspace]
members = [
    "crates/wie-pe",
    "crates/wie-runtime",
    "crates/wie-winapi",
    "crates/wie-cli",
    "crates/wie-cpu",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "LGPL-3.0-only"
authors = ["Vladislav Kalinkin"]
repository = "https://github.com/wie-project/wie"
description = "WIE — Wie Is Emulator"
exclude = [
    "screenshots/",
    "scripts/",
    "micro-exes/"
]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

serde = { version = "1.0", features = ["derive"] }

goblin = "0.9"

ahash = "0.8"
papaya = "0.2"

clap = { version = "4.5", features = ["derive"] }

criterion = "0.5"

[workspace.lints.rust]
# `deny` (not `forbid`) so wie-cpu can allow unsafe for Cranelift JIT entry points.
unsafe_code = "deny"
missing_docs = "allow"
unused_extern_crates = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
let_underscore_drop = "deny"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_prelude_collisions = "deny"

# ── Clippy: the curated table (maintainability plan T1.2) ────────────────────
#
# `deny`, not `warn`. `scripts/check.sh` and `ci.yml` run clippy WITHOUT
# `-D warnings`, so a `warn` entry here would leave the step green and the rule
# advisory — the confusion this table exists to end. `deny` is enforced by the
# compiler, so it fails the gate regardless of how clippy is invoked.
#
# Only lints that hold for every crate and every target belong in this table.
# `[workspace.lints.*]` binds a crate only through `[lints] workspace = true`
# (all five crates opt in), and cargo REJECTS a manifest that also declares its
# own `[lints.clippy]`:
#     cannot override `workspace.lints` in `lints`, either remove the overrides
#     or `lints.workspace = true` and manually specify the lints
# A workspace entry is therefore all-or-nothing: one crate that cannot pass it
# takes the table down for all five. Per-crate `[lints.clippy]` tables are not
# a staged-rollout lever here — a crate that overrides stops inheriting, and the
# 11-line `[workspace.lints.rust]` block above would have to be copied into it.
#
# The panic-family lints (`unwrap_used`, `expect_used`, `panic`) do not fit that
# constraint yet: `wie-cpu` measures 16/27/20 sites (39 under `src/jit/**`, 24 in
# `benches/jit_hot_paths.rs`), and `--all-targets` compiles the bench too. They
# are therefore denied per crate, in source, where each crate can own its
# exception — `#![cfg_attr(not(test), deny(...))]` at the top of `wie-pe`,
# `wie-winapi`, `wie-runtime` and `wie-cli`'s `lib.rs`.
# `indexing_slicing` is denied the same way in `wie-pe` and `wie-cli`,
# `as_conversions` in `wie-pe` only. CLAUDE.md's lint-policy section carries the
# measured site counts per crate and names what is still convention.
[workspace.lints.clippy]
# A `todo!()`/`unimplemented!()` that ships is a guest-reachable panic, and a
# `dbg!()` left behind is an unrequested stderr write on the hot path.
# Measured: 0 sites in all five crates, test code included — the entry is here
# to keep it that way, not to fix anything.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Guest output goes through the emulator's console/VFS, never the host's stdout;
# a stray `println!` in a library crate corrupts `wie run`'s own output. Measured
# 0 sites in `wie-pe`/`wie-cpu`/`wie-winapi`/`wie-runtime`. `wie-cli` is the one
# crate whose product *is* host stdout (23 production sites, all in
# `inspect`/`run`/`cli`), and it states that exception once, at its crate root.
print_stdout = "deny"

# ---------------------------------------------------------------------------
# Dev/test profile: dependencies optimized, our own crates instrumented.
#
# WHY THIS BLOCK EXISTS — do not delete it as redundant.
#
# `cargo test` / `cargo nextest run` use the `dev` profile. Before this block
# existed, cargo's *defaults* applied to every crate in the graph, so
# Cranelift, iced-x86, wgpu-core, naga, winit AND all of our own guest
# emulation, JIT lowering and software rasterization compiled at
# `opt-level=0`. The test suites then spent their wall clock inside the
# emulator machinery — JIT block compilation, iced decode, guest memory
# translation — instead of inside the assertions under test. Splitting the
# profile fixes that: third-party code (which nobody is debugging, and which
# is written to be fast) gets optimized, while the five workspace crates keep
# the dev defaults.
#
# `package."*"` matches NON-workspace members ONLY. Cargo's per-package profile
# lookup skips any id for which `ws.is_member(id)` holds, so `wie-pe`,
# `wie-cpu`, `wie-winapi`, `wie-runtime` and `wie-cli` inherit the plain
# `[profile.dev]` defaults and stay at `opt-level=0` with `debug-assertions`
# and `overflow-checks` ON. Verified empirically, not assumed: with
# `RUSTC_WRAPPER` capturing the real rustc argv under a clean target dir,
# cargo passes NO `-Copt-level` / `-Cdebug-assertions` / `-Coverflow-checks`
# for `wie_pe` while the same graph gains `-C opt-level=2` for the deps.
# Keeping our crates instrumented is the point: the software page-permission
# checks in `wie-cpu` and the guest address arithmetic in `wie-runtime` are
# exactly where a debug assertion is worth its keep, and paying for them on
# the test path is the whole trade we are making.
#
# Do NOT weaken `[profile.release]`: CONTRIBUTING.md pins the `long_loop`
# regression budget against that fat-LTO build.
# ---------------------------------------------------------------------------
[profile.dev]
# Intentionally empty. Listing nothing here is what keeps the workspace
# crates at opt-level=0 with debug-assertions/overflow-checks enabled.
[profile.dev.package."*"]
# opt-level 2, not 3. For a dep tree this size (Cranelift + wgpu + naga) the
# 2-vs-3 delta is small — LLVM's last big wins are mostly inlining-driven and
# opt-level=2 already inlines across crates — while 3 roughly doubles
# dep rebuild time, and dep rebuild time is what developers pay on every
# `cargo build` that invalidates the graph. Revisit to 3 only with a
# measurement behind it, not on a hunch.
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
