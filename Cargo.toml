[workspace]
members = [
    "crates/wie-pe",
    "crates/wie-runtime",
    "crates/wie-winapi",
    "crates/wie-cli",
    "crates/wie-cpu",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "LGPL-3.0-only"
authors = ["Vladislav Kalinkin"]
repository = "https://github.com/wie-project/wie"
description = "WIE — Wie Is Emulator"
exclude = [
    "screenshots/",
    "scripts/",
    "micro-exes/"
]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

serde = { version = "1.0", features = ["derive"] }

goblin = "0.9"

ahash = "0.8"
papaya = "0.2"

clap = { version = "4.5", features = ["derive"] }

criterion = "0.5"

[workspace.lints.rust]
# `deny` (not `forbid`) so wie-cpu can allow unsafe for Cranelift JIT entry points.
unsafe_code = "deny"
missing_docs = "allow"
unused_extern_crates = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
let_underscore_drop = "deny"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_prelude_collisions = "deny"

# No clippy lints are denied here: clippy runs at its defaults and is advisory
# in CI (`scripts/check.sh` invokes it without `-D warnings`). `#[allow]` /
# `#[expect]` leniency belongs in test code only.

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
